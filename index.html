<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

        <title>Patagonia PZ: comunidad de Project Zomboid</title>
        <meta name="description" content="Patagonia PZ es un servidor comunitario de Project Zomboid alojado en Argentina. PVE, sin wipes, build 42.20.3. Sumate a la comunidad y jugá con nosotros.">
        <link rel="canonical" href="https://patagoniapz.com.ar/">

        <!--
          Estos valores son los que ve cualquier bot que arma una vista previa
          de link sin ejecutar JavaScript (Discord, WhatsApp, Twitter/X,
          Facebook, etc.): siempre van a mostrar esto, sea cual sea la página
          que se comparta, porque el sitio no tiene HTML pre-renderizado por
          ruta. src/seo.js actualiza el título/descripción/canonical por
          página para usuarios reales y para crawlers que sí ejecutan
          JavaScript (Googlebot).
        -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Patagonia PZ">
        <meta property="og:locale" content="es_AR">
        <meta property="og:title" content="Patagonia PZ — comunidad de Project Zomboid">
        <meta property="og:description" content="Servidor comunitario de Project Zomboid alojado en Argentina. PVE, sin wipes, build 42.20.3. Sumate a la comunidad y jugá con nosotros.">
        <meta property="og:url" content="https://patagoniapz.com.ar/">
        <meta property="og:image" content="https://patagoniapz.com.ar/spiffo-icon.png">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Patagonia PZ — comunidad de Project Zomboid">
        <meta name="twitter:description" content="Servidor comunitario de Project Zomboid alojado en Argentina. PVE, sin wipes, build 42.20.3.">
        <meta name="twitter:image" content="https://patagoniapz.com.ar/spiffo-icon.png">

        <link rel="icon" type="image/png" href="/favicon.png">
        <link rel="apple-touch-icon" href="/favicon.png">
        <script type="text/javascript">
            // Contraparte de public/404.html: si se llegó acá por el redirect del 404
            // (query string con el formato "/?/ruta"), se restaura la URL limpia antes
            // de que arranque Vue Router.
            (function (l) {
                if (l.search[1] === '/') {
                    var decoded = l.search.slice(1).split('&').map(function (s) {
                        return s.replace(/~and~/g, '&');
                    }).join('?');
                    window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
                }
            }(window.location));
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
        <!-- <a href="https://www.trackyserver.com/es/project-zomboid-server/country/AR">Lista de servidores Project Zomboid</a> -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    </body>
</html>
